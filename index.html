<!DOCTYPE html>
<html lang="en">
    <head>

    <style> 
        img{
            margin-right:20px;

        video{
            margin-right:20px;

            }
            body {
                font-family: Arial,  sans-serif;
                padding: 20px;

            }
            p {
                color: white;

    h2{ font-size:75px;}
    </style>
    </head> 

    <body>

        <h1>Hello World this is my first website
        </h1> 
        <h2 >My pets</h2>
        <p> Here is a photo of Boris, He was a gentle giant. <br>
             <img src="IMG-boris.jpg" alt="Great Dane, white with black spots, both ears blowing in the wind whilst on a beach"
                  data-video="videos/Boris.mp4" role="button" tabindex="0" aria-label="Play video of Boris"> <br> <br>
        I also had 2 golden labradors and a tabby cat<br>
    <img src="IMG_5573.PNG" alt="2 golden labradors, one sitting behind the other both looking slightly to the left handside"
         data-video="videos/labs.mp4" role="button" tabindex="0" aria-label="Play video of the labradors">
    <img src="IMG-20220620-WA0003.jpeg" alt="brown cat with specks of orange and yellow, looking to the right with a slightly tilted head"
         data-video="videos/Cat1.mp4" role="button" tabindex="0" aria-label="Play video of the cat">
    <br>
</p>
    <script>
        function playPetVideo(image) {
            const video = document.createElement("video");
            video.src = image.dataset.video;
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.setAttribute("aria-label", image.getAttribute("aria-label"));
            image.replaceWith(video);
        }

        document.querySelectorAll("img[data-video]").forEach(function (image) {
            image.addEventListener("click", function () {
                playPetVideo(image);
            });
            image.addEventListener("keydown", function (event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    playPetVideo(image);
                }
            });
        });
    </script>
    </body>
    </html>
